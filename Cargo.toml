# HelloVPN workspace
#
# The [package] section defines the root binary (hvpn placeholder).
# The [workspace] section registers all crates.
# As new crates are created they are added to `members`.

[package]
name = "hellovpn"
version = "0.1.0"
edition = "2021"
description = "HelloVPN - Secure open-source VPN protocol"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hellovpn/hellovpn"

[workspace]
members = [
    "crates/hello-protocol",
    "crates/hello-core",
    "crates/hello-crypto",
    "crates/hello-config",
    "crates/hello-handshake",
    "crates/hello-packet",
    "crates/hello-transport",
    "crates/hello-session",
    "crates/hello-tun",
    "crates/hello-routing",
    "crates/hello-client",
    "crates/hello-server",
    "crates/hello-cli",
    "apps/hvpn",
    "apps/hvpn-server",
    "apps/hvpn-client",
]
resolver = "2"

# Workspace-wide dependency versions (avoids version drift across crates).
# Individual crates reference these with `dep = { workspace = true }`.
[workspace.dependencies]
# System
libc         = "0.2"

# Async runtime
tokio        = { version = "1.54",  features = ["full"] }
tokio-util   = { version = "0.7",   features = ["codec"] }
bytes        = "1.9"

# Error handling
anyhow       = "1.0"
thiserror    = "2.0"

# Serialisation
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
toml         = "0.8"

# Cryptography
snow         = "0.10"
rand_core    = { version = "0.6", features = ["getrandom"] }
zeroize      = { version = "1.8", features = ["derive"] }
base64       = "0.22"

# Logging / tracing
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap         = { version = "4.5",  features = ["derive"] }

# Testing
proptest     = "1.5"

[dependencies]
tokio = { workspace = true }

[[test]]
name = "integration_end_to_end"
path = "tests/integration/test_end_to_end.rs"

[dev-dependencies]
hello-core      = { path = "crates/hello-core" }
hello-protocol  = { path = "crates/hello-protocol" }
hello-crypto    = { path = "crates/hello-crypto" }
hello-config    = { path = "crates/hello-config" }
hello-handshake = { path = "crates/hello-handshake" }
hello-packet    = { path = "crates/hello-packet" }
hello-transport = { path = "crates/hello-transport" }
hello-session   = { path = "crates/hello-session" }
hello-tun       = { path = "crates/hello-tun" }
hello-routing   = { path = "crates/hello-routing" }
hello-client    = { path = "crates/hello-client" }
hello-server    = { path = "crates/hello-server" }
base64          = { workspace = true }

